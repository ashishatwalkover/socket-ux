<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram AI Reply Template</title>
<style>
  :root{
    --page-bg:#eef0f3;
    --page-text:#1c1c20;
    --page-muted:#6b6b76;
    font-family:-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--page-bg);
    color:var(--page-text);
    padding:40px 24px 64px;
  }
  .wrap{width:fit-content;max-width:1120px;margin:0 auto;}
  .intro{
    display:flex;
    justify-content:flex-end;
    margin-bottom:16px;
  }

  /* theme toggle switch */
  .theme-toggle{
    flex:none;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:6px;
    border-radius:999px;
    background:#ffffff;
    border:1px solid #dfe1e6;
  }
  .theme-toggle button{
    display:flex;
    align-items:center;
    justify-content:center;
    width:32px;height:32px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:#8a8a94;
    cursor:pointer;
    font-family:inherit;
  }
  .theme-toggle button.active{
    background:#1c1c20;
    color:#fdf4e2;
  }
  .theme-toggle button:focus-visible{outline:2px solid #3f7de6;outline-offset:2px;}

  .stage{
    width:fit-content;
    max-width:100%;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,0.04), 0 12px 32px -16px rgba(0,0,0,0.25);
    background:var(--bg);
  }

  /* ---- theme tokens ---- */
  .stage.theme-dark{
    --bg:#141416; --panel:#1a1a1d; --border:#2b2b2f;
    --text:#f1f1f3; --muted:#95959e; --muted-2:#6f6f78;
    --accent:#5b93f5; --accent-line:#33343a;
    --pill-bg:#3a2c14; --pill-text:#f0a83c;
    --icon-tile-bg:#26262a; --icon-tile-border:#333338;
    --surface-2:#1f1f24; --surface-2-border:#2d2d33;
    --btn-border:#34343a; --btn-hover:#1f1f23;
    --field-bg:#1d1d21; --chip-bg:#2c2c31;
    --code-bg:#1b2027; --code-key:#f27d72; --code-str:#e88e5a; --code-num:#e8b45a;
    --step-active:#24272d;
  }
  .stage.theme-light{
    --bg:#ffffff; --panel:#fbfbfc; --border:#e6e6ea;
    --text:#17171a; --muted:#6c6c76; --muted-2:#9a9aa2;
    --accent:#3f7de6; --accent-line:#dcdce2;
    --pill-bg:#fdedd3; --pill-text:#a15d0a;
    --icon-tile-bg:#f2f2f4; --icon-tile-border:#e6e6ea;
    --surface-2:#f2f3f5; --surface-2-border:#e6e6ea;
    --btn-border:#dedee3; --btn-hover:#f4f4f6;
    --field-bg:#f6f7f9; --chip-bg:#e9eaee;
    --code-bg:#f4f6f9; --code-key:#c2453a; --code-str:#b05a1e; --code-num:#9a6b10;
    --step-active:#e9edf5;
  }

  .canvas{
    background:var(--bg);
    padding:44px 48px;
    display:flex;
    flex-direction:column;
  }
  .canvas h1{
    font-size:27px;
    font-weight:650;
    letter-spacing:-0.01em;
    color:var(--text);
    margin:0 0 8px;
    text-wrap:balance;
  }
  .canvas .sub{
    font-size:15px;
    color:var(--muted);
    margin:0;
  }

  /* working area splits into [ steps | detail ] once a step is opened */
  .work-area{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,0fr);
    transition:grid-template-columns 400ms cubic-bezier(.4,0,.2,1);
    align-items:start;
    margin-top:24px;
  }
  .work-area.detail-open{
    grid-template-columns:minmax(300px,340px) minmax(0,1fr);
  }

  .app-section{
    padding:20px 22px;
    border-radius:14px;
    background:var(--surface-2);
    border:1px solid var(--surface-2-border);
  }
  .app-section-top{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .configure-cta{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 20px;
    border-radius:10px;
    border:1.5px solid var(--accent);
    background:transparent;
    color:var(--accent);
    font-size:14px;
    font-weight:650;
    cursor:pointer;
    font-family:inherit;
  }
  .configure-cta:hover{background:var(--btn-hover);}
  .configure-cta:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .configure-cta .chevron{transition:transform 260ms ease;}
  .configure-cta[aria-expanded="true"] .chevron{transform:rotate(90deg);}

  .app-icons-row{
    display:flex;
    gap:10px;
    transition:opacity 220ms ease, transform 220ms ease;
  }
  .app-section.open .app-icons-row{
    opacity:0;
    transform:translateX(8px);
    pointer-events:none;
    width:0;
    overflow:hidden;
  }
  .app-icon{
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg);
    border:1px solid var(--icon-tile-border);
    color:var(--text);
  }
  .app-icon.dim{color:var(--accent);}

  .steps-reveal{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows 320ms cubic-bezier(.4,0,.2,1);
  }
  .steps-reveal.open{grid-template-rows:1fr;}
  .steps-reveal-inner{overflow:hidden;}
  .steps-reveal .steps{
    padding-top:18px;
    margin-top:16px;
    border-top:1px solid var(--surface-2-border);
  }

  /* step timeline */
  .steps{position:relative;}
  .steps::before{
    content:"";
    position:absolute;
    left:11px; top:22px; bottom:22px;
    width:2px;
    background:var(--accent-line);
  }
  .step{
    position:relative;
    display:grid;
    grid-template-columns:24px 40px 1fr auto;
    align-items:center;
    column-gap:12px;
    padding:9px 8px 9px 0;
    width:100%;
    border:none;
    background:transparent;
    text-align:left;
    font-family:inherit;
    cursor:pointer;
    border-radius:10px;
  }
  .step:hover{background:var(--btn-hover);}
  .step:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .step.active{background:var(--step-active);}
  .step .go{
    color:var(--muted-2);
    opacity:0;
    transition:opacity 150ms ease;
  }
  .step:hover .go, .step.active .go{opacity:1;}
  .dot{
    position:relative; z-index:1;
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    justify-self:center;
  }
  .dot.muted{background:var(--muted-2);}
  .tile{
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:var(--icon-tile-bg);
    border:1px solid var(--icon-tile-border);
    color:var(--text);
  }
  .tile.dim{color:var(--accent);}
  .tile.dim svg{opacity:0.7;}
  .step-label{
    font-size:14.5px;
    font-weight:500;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .step-label.dim{color:var(--muted);}
  .step-meta{display:flex;align-items:center;gap:8px;}
  .pill{
    font-size:11.5px;
    font-weight:650;
    padding:4px 11px;
    border-radius:999px;
    background:var(--pill-bg);
    color:var(--pill-text);
    white-space:nowrap;
  }

  .filler{height:32px;}
  .divider{border-top:1px solid var(--border);}

  /* advanced flow — small link that expands */
  .advanced-link{
    display:inline-flex;
    align-items:center;
    gap:7px;
    align-self:flex-start;
    margin-top:18px;
    padding:0;
    border:none;
    background:transparent;
    color:var(--muted);
    font-size:13px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    text-decoration:underline;
    text-decoration-color:var(--accent-line);
    text-underline-offset:4px;
  }
  .advanced-link:hover{color:var(--text);}
  .advanced-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .advanced-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows 280ms cubic-bezier(.4,0,.2,1);
  }
  .advanced-body.open{grid-template-rows:1fr;}
  .advanced-body-inner{overflow:hidden;}
  .advanced-help{
    font-size:13.5px;
    color:var(--muted-2);
    margin:12px 0 14px;
  }
  .optional-pill{
    font-size:11px;
    font-weight:600;
    padding:2px 9px;
    border-radius:999px;
    background:var(--icon-tile-bg);
    border:1px solid var(--icon-tile-border);
    color:var(--muted);
  }
  .switch-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:10px 18px;
    border-radius:10px;
    border:1px solid var(--btn-border);
    background:transparent;
    color:var(--text);
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.04em;
    cursor:pointer;
    font-family:inherit;
  }
  .switch-btn:hover{background:var(--btn-hover);}
  .switch-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .mini-icons{display:flex;}
  .mini-icons span{
    width:20px;height:20px;border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    margin-left:-6px;
    border:1.5px solid var(--bg);
  }
  .mini-icons span:first-child{margin-left:0;}

  /* ================= DETAIL PANEL (right of steps) ================= */
  .detail-panel{
    min-width:0;
    overflow:hidden;
    align-self:stretch;
  }
  .work-area.detail-open .detail-panel{
    border-left:1px solid var(--border);
    margin-left:28px;
    padding-left:28px;
  }
  .detail-inner{
    min-width:420px;
    animation:detail-in 300ms ease;
  }
  @keyframes detail-in{
    from{opacity:0;transform:translateX(12px);}
    to{opacity:1;transform:none;}
  }
  @media (prefers-reduced-motion: reduce){
    .detail-inner{animation:none;}
  }
  .detail-header{
    display:flex;
    align-items:center;
    gap:14px;
    padding-bottom:18px;
    border-bottom:1px solid var(--border);
    margin-bottom:22px;
  }
  .detail-header .tile{width:36px;height:36px;}
  .detail-header h3{
    font-size:21px;
    font-weight:650;
    color:var(--text);
    margin:0;
    flex:1;
  }
  .close-btn{
    display:flex;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:9px;
    border:none;background:transparent;
    color:var(--muted);cursor:pointer;font-family:inherit;
  }
  .close-btn:hover{background:var(--btn-hover);color:var(--text);}
  .close-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .field-group{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:14px;
    padding:20px 22px;
    border-radius:12px;
    background:var(--field-bg);
    border:1px solid var(--border);
    margin-bottom:16px;
  }
  .field-label{
    font-size:15px;
    color:var(--text);
    font-weight:500;
  }
  .req{color:#e05252;}
  .chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 14px;
    border-radius:999px;
    background:var(--chip-bg);
    color:var(--text);
    font-size:13.5px;
    font-weight:550;
  }
  .chip .chip-x{
    display:flex;align-items:center;justify-content:center;
    width:16px;height:16px;border-radius:50%;
    background:var(--muted-2);color:var(--bg);
  }
  .add-title{
    font-size:13px;
    font-weight:700;
    letter-spacing:0.05em;
    color:var(--accent);
    cursor:pointer;
  }

  .action-row{display:flex;gap:10px;margin:4px 0 22px;}
  .test-btn{
    padding:10px 24px;
    border-radius:8px;
    border:1px solid var(--accent);
    background:transparent;
    color:var(--accent);
    font-size:13px;
    font-weight:700;
    letter-spacing:0.06em;
    cursor:pointer;
    font-family:inherit;
  }
  .test-btn:hover{background:var(--btn-hover);}
  .save-btn{
    padding:10px 24px;
    border-radius:8px;
    border:1px solid var(--btn-border);
    background:var(--icon-tile-bg);
    color:var(--muted-2);
    font-size:13px;
    font-weight:700;
    letter-spacing:0.06em;
    font-family:inherit;
    cursor:not-allowed;
  }
  .test-btn:focus-visible, .save-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .status-pill{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:11px 18px;
    border-radius:10px;
    background:var(--field-bg);
    border:1px solid var(--border);
    color:var(--text);
    font-size:14px;
    margin-bottom:20px;
  }
  .status-pill .green{
    width:8px;height:8px;border-radius:50%;
    background:#3fb26a;
  }

  .response-tab{
    display:flex;
    justify-content:flex-end;
    margin-bottom:10px;
  }
  .response-tab span{
    font-size:13px;
    font-weight:700;
    letter-spacing:0.08em;
    color:var(--accent);
    padding-bottom:7px;
    border-bottom:2.5px solid var(--accent);
  }
  .code-card{
    border-radius:12px;
    background:var(--field-bg);
    border:1px solid var(--border);
    padding:16px 18px 18px;
  }
  .code-card .body-label{
    font-size:13.5px;
    color:var(--muted);
    margin:0 0 10px;
  }
  .code-scroll{overflow-x:auto;border-radius:8px;}
  .code-block{
    background:var(--code-bg);
    border-radius:8px;
    padding:14px 16px;
    font-family:"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px;
    line-height:1.75;
    color:var(--text);
    min-width:320px;
  }
  .code-block .ln{
    display:inline-block;
    width:2.2em;
    color:var(--muted-2);
    user-select:none;
    font-variant-numeric:tabular-nums;
  }
  .code-block .k{color:var(--code-key);}
  .code-block .s{color:var(--code-str);}
  .code-block .n{color:var(--code-num);}

  @media (prefers-reduced-motion: no-preference){
    .switch-btn, .theme-toggle button, .test-btn, .step{transition:background 120ms ease,color 120ms ease;}
  }
  @media (max-width:860px){
    .work-area, .work-area.detail-open{grid-template-columns:1fr;}
    .work-area.detail-open .detail-panel{
      border-left:none;
      border-top:1px solid var(--border);
      margin-left:0;padding-left:0;
      margin-top:22px;padding-top:22px;
    }
    .detail-inner{min-width:0;}
    .canvas{padding:32px 24px;}
  }
</style>
</head>
<body>

<!-- shared instagram gradient -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ig-grad" x1="0" y1="20" x2="20" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#feda75"/><stop offset="0.35" stop-color="#d62976"/>
      <stop offset="0.7" stop-color="#962fbf"/><stop offset="1" stop-color="#4f5bd5"/>
    </linearGradient>
  </defs>
</svg>

<div class="wrap">
  <div class="intro">
    <div class="theme-toggle" role="group" aria-label="Theme">
      <button type="button" id="btn-dark" class="active" aria-pressed="true" title="Dark mode">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.7 14.9A8.5 8.5 0 0 1 9.1 3.3a.7.7 0 0 0-.9-.9 10 10 0 1 0 13.4 13.4.7.7 0 0 0-.9-.9Z"/></svg>
      </button>
      <button type="button" id="btn-light" aria-pressed="false" title="Light mode">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      </button>
    </div>
  </div>

  <div class="stage theme-dark" id="stage">
    <div class="canvas">
      <h1>Automatically Reply to Instagram Comments Using AI</h1>
      <p class="sub">AI-Generated Human-Like Replies</p>

      <div class="work-area" id="work-area">
        <!-- LEFT: configure + steps -->
        <div class="app-section" id="app-section">
          <div class="app-section-top">
            <button class="configure-cta" type="button" id="configure-toggle" aria-expanded="false" aria-controls="configure-steps">
              Configure
              <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg>
            </button>

            <div class="app-icons-row" id="app-icons">
              <span class="app-icon" data-icon="instagram"></span>
              <span class="app-icon" data-icon="agent"></span>
              <span class="app-icon dim" data-icon="timer"></span>
            </div>
          </div>

          <div class="steps-reveal" id="configure-steps">
            <div class="steps-reveal-inner">
              <div class="steps" id="card-steps"></div>
            </div>
          </div>
        </div>

        <!-- RIGHT: step detail -->
        <div class="detail-panel" id="detail-panel" aria-live="polite"></div>
      </div>

      <div class="filler"></div>
      <div class="divider"></div>

      <button class="advanced-link" type="button" id="advanced-toggle" aria-expanded="false" aria-controls="advanced-body">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.7 7.7 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.7 7.7 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.7 7.7 0 0 0 1.7 1L11 21h4l.3-2.9a7.7 7.7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6Z"/></svg>
        Advanced flow
        <span class="optional-pill">optional</span>
      </button>

      <div class="advanced-body" id="advanced-body">
        <div class="advanced-body-inner">
          <p class="advanced-help">Add extra steps to customize this template.</p>
          <button class="switch-btn" type="button">
            <span class="mini-icons">
              <span style="background:#20a95a"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M6 3h9l3 3v15H6z"/><path d="M9 12h6M9 16h6M9 8h3"/></svg></span>
              <span style="background:#e8792f"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M12 3 4 7v10l8 4 8-4V7z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg></span>
              <span style="background:#c04ab0"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="m6 16 4-4.5 3 3 3-3.5 3 5"/></svg></span>
            </span>
            SWITCH TO ADVANCED FLOW&nbsp; &rarr;
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function(){
    var ICONS = {
      instagram: '<svg width="20" height="20" viewBox="0 0 20 20"><rect x="1.5" y="1.5" width="17" height="17" rx="5.5" fill="url(#ig-grad)"/><rect x="6.2" y="6.2" width="7.6" height="7.6" rx="2.4" fill="none" stroke="#fff" stroke-width="1.3"/><circle cx="10" cy="10" r="2.3" fill="none" stroke="#fff" stroke-width="1.3"/><circle cx="14.1" cy="5.9" r="0.9" fill="#fff"/></svg>',

      timer: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.8 1.6"/><path d="M9 2.5h6"/></svg>'

    var STEPS = [

        json:[

          ['"time"','k',': ','1783061262','n',','],
          ['"user_id"','k',': ','"1784141532518116"','s',','],
          ['"comment_id"','k',': ','"18084697289638015"','s',','],
          ['"comment_text"','k',': ','"🔥"','s',','],
          ['"from_id"','k',': ','"2290831435077097"','s',','],
          ['"from_username"','k',': ','"ashish.0402"','s',','],
          ['"media_id"','k',': ','"17896751184504347"','s',','],
          ['"media_product_type"','k',': ','"FEED"','s',''],
          ['}']
        ]
      },
      {
        label:'Send Message to AI Agent', icon:'agent',
        connection:{icon:'agent', name:'Comment Reply Agent'},
        field:{label:'Message', chip:'comment_text'},
        status:'Showing data from 6h, 12:17',
        json:[
          ['{'],
          ['"reply"','k',': ','"Thank you so much! 🙌"','s',','],
          ['"tone"','k',': ','"friendly"','s',','],
          ['"confidence"','k',': ','0.94','n',''],
          ['}']
        ]
      },
      {
        label:'Return a rando…', icon:'timer', dim:true, paused:true,
        connection:{icon:'timer', name:'Built-in delay'},
        field:{label:'Wait between', chip:'30–90 seconds'},
        status:'Step paused — last run 6h ago',
        json:[
          ['{'],
          ['"delay_seconds"','k',': ','62','n',''],
          ['}']
        ]
      },
      {
        label:'Reply to Comment', icon:'instagram',
        connection:{icon:'instagram', name:'ashishatwalkover'},
        field:{label:'Reply message', chip:'AI Agent reply'},
        status:'Showing data from 6h, 12:17',
        json:[
          ['{'],
          ['"id"','k',': ','"18127348902711436"','s',','],
          ['"status"','k',': ','"published"','s',''],
          ['}']
        ]
      }
    ];

    var stage = document.getElementById('stage');
    var workArea = document.getElementById('work-area');
    var appSection = document.getElementById('app-section');
    var configureToggle = document.getElementById('configure-toggle');
    var configureSteps = document.getElementById('configure-steps');
    var cardSteps = document.getElementById('card-steps');
    var detailPanel = document.getElementById('detail-panel');

    document.querySelectorAll('.app-icon').forEach(function(el){
      el.innerHTML = ICONS[el.getAttribute('data-icon')];
    });

    function buildStepButton(s, i){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'step';
      btn.setAttribute('data-index', i);
      btn.innerHTML =
        '<span class="dot' + (s.paused ? ' muted' : '') + '"></span>' +
        '<span class="tile' + (s.dim ? ' dim' : '') + '">' + ICONS[s.icon] + '</span>' +
        '<span class="step-label' + (s.dim ? ' dim' : '') + '">' + s.label + '</span>' +
        '<span class="step-meta">' +
          (s.paused ? '<span class="pill">Paused</span>' : '') +
          '<svg class="go" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg>' +
        '</span>';
      return btn;
    }

    STEPS.forEach(function(s, i){
      cardSteps.appendChild(buildStepButton(s, i));
    });

    // Configure button: hide icons, reveal step list in place
    configureToggle.addEventListener('click', function(){
      var isOpen = configureSteps.classList.toggle('open');
      appSection.classList.toggle('open', isOpen);
      configureToggle.setAttribute('aria-expanded', String(isOpen));
      if(!isOpen) closeDetail();
    });

    function renderDetail(i){
      var s = STEPS[i];

      var jsonHtml = s.json.map(function(line, idx){
        var ln = '<span class="ln">' + (idx + 1) + '</span>';
        if(line.length === 1) return ln + line[0];
        var key = '<span class="' + line[1] + '">' + line[0] + '</span>';
        var val = '<span class="' + line[4] + '">' + line[3] + '</span>';
        return ln + '&nbsp;&nbsp;' + key + line[2] + val + line[5];
      }).join('<br>');

      var connIcon = ICONS[s.connection.icon].replace(/width="\d+" height="\d+"/, 'width="15" height="15"');

      detailPanel.innerHTML =
        '<div class="detail-inner">' +
          '<div class="detail-header">' +
            '<span class="tile' + (s.dim ? ' dim' : '') + '">' + ICONS[s.icon] + '</span>' +
            '<h3>' + s.label + '</h3>' +
            '<button class="close-btn" type="button" id="detail-close" aria-label="Close">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 5l14 14M19 5L5 19"/></svg>' +
            '</button>' +
          '</div>' +
          '<div class="field-group">' +
            '<span class="field-label">Using Connection <span class="req">*</span></span>' +
            '<span class="chip"><span style="display:flex">' + connIcon + '</span>' + s.connection.name + '</span>' +
            '<span class="add-title">ADD TITLE</span>' +
          '</div>' +
          '<div class="field-group">' +
            '<span class="field-label">' + s.field.label + '<span class="req">*</span></span>' +
            '<span class="chip">' + s.field.chip +
              '<span class="chip-x"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 5l14 14M19 5L5 19"/></svg></span>' +
            '</span>' +
          '</div>' +
          '<div class="action-row">' +
            '<button class="test-btn" type="button">TEST</button>' +
            '<button class="save-btn" type="button" disabled>SAVE</button>' +
          '</div>' +
          '<div><span class="status-pill"><span class="green"></span>' + s.status + '</span></div>' +
          '<div class="response-tab"><span>RESPONSE</span></div>' +
          '<div class="code-card">' +
            '<p class="body-label">body</p>' +
            '<div class="code-scroll"><div class="code-block">' + jsonHtml + '</div></div>' +
          '</div>' +
        '</div>';

      cardSteps.querySelectorAll('.step').forEach(function(b){
        b.classList.toggle('active', Number(b.getAttribute('data-index')) === i);
      });

      document.getElementById('detail-close').addEventListener('click', closeDetail);
    }

    function openDetail(i){
      workArea.classList.add('detail-open');
      renderDetail(i);
    }
    function closeDetail(){
      workArea.classList.remove('detail-open');
      cardSteps.querySelectorAll('.step').forEach(function(b){ b.classList.remove('active'); });
    }

    cardSteps.addEventListener('click', function(e){
      var btn = e.target.closest('.step');
      if(btn) openDetail(Number(btn.getAttribute('data-index')));
    });

    // advanced flow link
    var advancedToggle = document.getElementById('advanced-toggle');
    var advancedBody = document.getElementById('advanced-body');
    advancedToggle.addEventListener('click', function(){
      var isOpen = advancedBody.classList.toggle('open');
      advancedToggle.setAttribute('aria-expanded', String(isOpen));
    });

    // theme
    var darkBtn = document.getElementById('btn-dark');
    var lightBtn = document.getElementById('btn-light');
    function setTheme(isDark){
      stage.classList.toggle('theme-dark', isDark);
      stage.classList.toggle('theme-light', !isDark);
      darkBtn.classList.toggle('active', isDark);
      lightBtn.classList.toggle('active', !isDark);
      darkBtn.setAttribute('aria-pressed', String(isDark));
      lightBtn.setAttribute('aria-pressed', String(!isDark));
    }
    darkBtn.addEventListener('click', function(){ setTheme(true); });
    lightBtn.addEventListener('click', function(){ setTheme(false); });
  })();
</script>
</body>
</html>
